<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioKt — DNA 3D Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;right:0;padding:14px 20px;background:linear-gradient(180deg,rgba(13,17,23,.95) 0%,transparent 100%);display:flex;align-items:center;gap:16px;z-index:10;pointer-events:none}
#ui .logo{font-size:14px;font-weight:800;color:#58a6ff}
#ui .title{font-size:13px;color:#8b949e}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.btn{background:rgba(31,97,235,.85);border:1px solid #1f6feb;color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;backdrop-filter:blur(8px);transition:all .2s;pointer-events:all}
.btn:hover{background:#1f6feb;transform:translateY(-1px)}
.btn.active{background:#0f766e;border-color:#0f766e}
#legend{position:fixed;top:60px;right:20px;background:rgba(22,27,34,.9);border:1px solid #30363d;border-radius:10px;padding:14px 16px;z-index:10;min-width:150px}
#legend h3{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:#c9d1d9}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#info{position:fixed;top:60px;left:20px;background:rgba(22,27,34,.9);border:1px solid #30363d;border-radius:10px;padding:14px 16px;z-index:10;font-size:12px;color:#8b949e;line-height:1.8}
#info .val{color:#58a6ff;font-weight:700}
#back-btn{position:fixed;top:14px;right:20px;pointer-events:all;z-index:20}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="logo">BioKt v2.0</div>
  <div class="title">DNA Double Helix — 3D Viewer</div>
</div>

<div id="legend">
  <h3>Legend</h3>
  <div class="legend-row"><div class="legend-dot" style="background:#f87171"></div>Adenine (A)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#60a5fa"></div>Thymine (T)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#4ade80"></div>Guanine (G)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#facc15"></div>Cytosine (C)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#94a3b8"></div>Backbone</div>
  <div class="legend-row"><div class="legend-dot" style="background:#475569"></div>Base Pair Bond</div>
</div>

<div id="info">
  <div>Sequence: <span class="val" id="info-seq">—</span></div>
  <div>Length: <span class="val" id="info-len">—</span> bp</div>
  <div>GC Content: <span class="val" id="info-gc">—</span>%</div>
  <div>Pairs: <span class="val" id="info-pairs">—</span></div>
</div>

<div id="controls">
  <button class="btn active" onclick="setView('helix')">🧬 Full Helix</button>
  <button class="btn" onclick="setView('bases')">🔵 Base Pairs</button>
  <button class="btn" onclick="setView('surface')">🌐 Surface</button>
  <button class="btn" onclick="toggleSpin()">⟳ Auto Spin</button>
  <button class="btn" onclick="resetCamera()">⊙ Reset</button>
</div>

<a href="javascript:history.back()" id="back-btn">
  <button class="btn">← Back to Report</button>
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene setup ───────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.FogExp2(0x0d1117, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(20, 0, 0);
camera.lookAt(0, 0, 0);

// ── Lighting ──────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x1e3a5f, 0.8);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0x4fc3f7, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x3b82f6, 0.4);
fill.position.set(-10, -10, -5);
scene.add(fill);
const point1 = new THREE.PointLight(0x22d3ee, 0.8, 60);
point1.position.set(0, 10, 8);
scene.add(point1);
const point2 = new THREE.PointLight(0xf472b6, 0.6, 60);
point2.position.set(0, -10, -8);
scene.add(point2);

// ── DNA sequence ──────────────────────────────────────────────
const urlParams = new URLSearchParams(location.search);
const seqParam = urlParams.get('seq') || 'ATGGCCATTGTAATGGGCCGCTGAAAGGGTGCCCGATAG';
const sequence = seqParam.toUpperCase().replace(/[^ATGC]/g, 'A');

// Update info panel
document.getElementById('info-seq').textContent = sequence.length > 20 ? sequence.substring(0,20)+'…' : sequence;
document.getElementById('info-len').textContent = sequence.length;
const gcCount = sequence.split('').filter(b => b==='G'||b==='C').length;
document.getElementById('info-gc').textContent = (gcCount/sequence.length*100).toFixed(1);
document.getElementById('info-pairs').textContent = sequence.length;

const COMPLEMENT = {A:'T',T:'A',G:'C',C:'G'};
const BASE_COLORS = {
  A: new THREE.Color(0xf87171),
  T: new THREE.Color(0x60a5fa),
  G: new THREE.Color(0x4ade80),
  C: new THREE.Color(0xfacc15)
};
const BACKBONE_COLOR = new THREE.Color(0x94a3b8);
const BOND_COLOR     = new THREE.Color(0x334155);

// ── Geometry helpers ──────────────────────────────────────────
function sphere(r, color, pos, emissive) {
  const geo = new THREE.SphereGeometry(r, 16, 16);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: emissive || new THREE.Color(0x000000),
    emissiveIntensity: emissive ? 0.3 : 0,
    shininess: 80, specular: new THREE.Color(0x4fc3f7)
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  m.castShadow = true;
  return m;
}

function cylinder(from, to, radius, color, opacity) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(radius, radius, len, 8, 1);
  const mat = new THREE.MeshPhongMaterial({
    color, transparent: opacity !== undefined, opacity: opacity !== undefined ? opacity : 1.0,
    shininess: 40
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}

// ── Build DNA helix ───────────────────────────────────────────
const helixGroup = new THREE.Group();
scene.add(helixGroup);

const N = sequence.length;
const RISE_PER_BP  = 0.34 * 5;    // Å → scene units (×5)
const TWIST_PER_BP = (2 * Math.PI) / 10.0;  // 36° per base pair
const HELIX_RADIUS = 2.8;
const BASE_RADIUS  = 0.28;
const BACKBONE_R   = 0.22;
const BOND_R       = 0.12;
const TOTAL_HEIGHT = N * RISE_PER_BP;

const strand1Pts = [];
const strand2Pts = [];
const basePositions1 = [];
const basePositions2 = [];

for (let i = 0; i < N; i++) {
  const y    = i * RISE_PER_BP - TOTAL_HEIGHT / 2;
  const ang1 = i * TWIST_PER_BP;
  const ang2 = ang1 + Math.PI;

  const p1 = new THREE.Vector3(HELIX_RADIUS * Math.cos(ang1), y, HELIX_RADIUS * Math.sin(ang1));
  const p2 = new THREE.Vector3(HELIX_RADIUS * Math.cos(ang2), y, HELIX_RADIUS * Math.sin(ang2));

  strand1Pts.push(p1.clone());
  strand2Pts.push(p2.clone());
  basePositions1.push(p1.clone());
  basePositions2.push(p2.clone());

  // Base spheres
  const base1 = sequence[i];
  const base2 = COMPLEMENT[base1] || 'T';
  const bs1 = sphere(BASE_RADIUS, BASE_COLORS[base1], p1, BASE_COLORS[base1]);
  const bs2 = sphere(BASE_RADIUS, BASE_COLORS[base2], p2, BASE_COLORS[base2]);
  bs1.userData = { type:'base', base:base1, index:i, strand:1 };
  bs2.userData = { type:'base', base:base2, index:i, strand:2 };
  helixGroup.add(bs1);
  helixGroup.add(bs2);

  // Base pair bond (hydrogen bond)
  const bond = cylinder(p1, p2, BOND_R, BOND_COLOR, 0.5);
  helixGroup.add(bond);
}

// Backbone ribbons using smooth TubeGeometry
function makeBackbone(pts, color) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo   = new THREE.TubeGeometry(curve, pts.length * 3, BACKBONE_R, 8, false);
  const mat   = new THREE.MeshPhongMaterial({ color, shininess: 60, specular: new THREE.Color(0xffffff) });
  return new THREE.Mesh(geo, mat);
}

const bb1 = makeBackbone(strand1Pts, new THREE.Color(0x3b82f6));
const bb2 = makeBackbone(strand2Pts, new THREE.Color(0xf59e0b));
helixGroup.add(bb1);
helixGroup.add(bb2);

// ── Surface mode (transparent cylinder) ───────────────────────
const surfaceGeo = new THREE.CylinderGeometry(HELIX_RADIUS + 0.8, HELIX_RADIUS + 0.8, TOTAL_HEIGHT, 32, 1, true);
const surfaceMat = new THREE.MeshPhongMaterial({
  color: 0x22d3ee, transparent: true, opacity: 0.08,
  side: THREE.DoubleSide, wireframe: false
});
const surface = new THREE.Mesh(surfaceGeo, surfaceMat);
surface.visible = false;
helixGroup.add(surface);

// ── Grid floor ────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(40, 20, 0x1e3a5f, 0x1e3a5f);
gridHelper.position.y = -TOTAL_HEIGHT / 2 - 2;
scene.add(gridHelper);

// ── Particles (background stars) ─────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 2000; i++) {
  starVerts.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0x4b5563, size: 0.15 });
scene.add(new THREE.Points(starGeo, starMat));

// ── Mouse orbit ────────────────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let rotY = 0, rotX = 0, targetRotY = 0, targetRotX = 0;
let zoom = 20, targetZoom = 20;
let autoSpin = true;

canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mouseup',   () => isDragging = false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  targetZoom = Math.max(5, Math.min(60, targetZoom + e.deltaY * 0.02));
});
// Touch support
canvas.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; });
canvas.addEventListener('touchend',   () => isDragging = false);
canvas.addEventListener('touchmove',  e => {
  const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
  targetRotY += dx * 0.005; targetRotX += dy * 0.005;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
});

// ── Controls ──────────────────────────────────────────────────
let currentView = 'helix';
function setView(v) {
  currentView = v;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // Show/hide elements
  helixGroup.traverse(c => {
    if (!c.isMesh) return;
    if (v === 'helix') c.visible = true;
    if (v === 'bases') {
      c.visible = c.userData.type === 'base';
    }
    if (v === 'surface') {
      c.visible = (c === surface) || c.userData.type === 'base';
      if (c === surface) c.visible = true;
    }
  });
  if (v === 'surface') surface.visible = true;
  bb1.visible = v !== 'bases';
  bb2.visible = v !== 'bases';
}

let spinning = true;
function toggleSpin() {
  spinning = !spinning;
  event.target.textContent = spinning ? '⟳ Auto Spin' : '⏸ Paused';
  event.target.classList.toggle('active', spinning);
}

function resetCamera() {
  targetRotY = 0; targetRotX = 0; targetZoom = 20;
}

// ── Render loop ───────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;

  // Smooth orbit
  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;
  zoom += (targetZoom - zoom) * 0.08;

  if (spinning) targetRotY += 0.003;

  // Animate point lights
  point1.position.set(Math.cos(t)*12, Math.sin(t*0.5)*6, Math.sin(t)*8);
  point2.position.set(-Math.cos(t)*12, -Math.sin(t*0.5)*6, -Math.sin(t)*8);

  // Camera position from spherical coords
  const cx = zoom * Math.cos(rotX) * Math.sin(rotY);
  const cy = zoom * Math.sin(rotX);
  const cz = zoom * Math.cos(rotX) * Math.cos(rotY);
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
