<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioKt — Molecule 3D Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;right:0;padding:14px 20px;background:linear-gradient(180deg,rgba(13,17,23,.95) 0%,transparent 100%);display:flex;align-items:center;gap:16px;z-index:10;pointer-events:none}
#ui .logo{font-size:14px;font-weight:800;color:#58a6ff}
#ui .title{font-size:13px;color:#8b949e}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:10}
.btn{background:rgba(31,97,235,.85);border:1px solid #1f6feb;color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;backdrop-filter:blur(8px);transition:all .2s;pointer-events:all}
.btn:hover{background:#1f6feb;transform:translateY(-1px)}
.btn.active{background:#0f766e;border-color:#0f766e}
#legend{position:fixed;top:60px;right:20px;background:rgba(22,27,34,.9);border:1px solid #30363d;border-radius:10px;padding:14px 16px;z-index:10;min-width:140px}
#legend h3{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:#c9d1d9}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#info{position:fixed;top:60px;left:20px;background:rgba(22,27,34,.9);border:1px solid #30363d;border-radius:10px;padding:14px 16px;z-index:10;font-size:12px;color:#8b949e;line-height:1.9}
#info .val{color:#58a6ff;font-weight:700}
#back-btn{position:fixed;top:14px;right:20px;pointer-events:all;z-index:20}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div class="logo">BioKt v2.0</div>
  <div class="title" id="mol-title">Molecule — 3D Viewer</div>
</div>
<div id="legend">
  <h3>CPK Colors</h3>
  <div class="legend-row"><div class="legend-dot" style="background:#94a3b8"></div>Carbon (C)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>Oxygen (O)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#3b82f6"></div>Nitrogen (N)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#facc15"></div>Sulfur (S)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#4ade80"></div>Aromatic</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f97316"></div>Hydrogen</div>
</div>
<div id="info">
  <div>Name: <span class="val" id="info-name">—</span></div>
  <div>Formula: <span class="val" id="info-formula">—</span></div>
  <div>Atoms: <span class="val" id="info-atoms">—</span></div>
  <div>Bonds: <span class="val" id="info-bonds">—</span></div>
  <div>Rings: <span class="val" id="info-rings">—</span></div>
</div>
<div id="controls">
  <button class="btn active" onclick="setStyle('ballstick')">⚫ Ball-and-Stick</button>
  <button class="btn" onclick="setStyle('spacefill')">🔵 Space Fill</button>
  <button class="btn" onclick="setStyle('wireframe')">🕸️ Wireframe</button>
  <button class="btn" onclick="setStyle('stick')">🪄 Stick</button>
  <button class="btn" onclick="toggleSpin()">⟳ Auto Spin</button>
  <button class="btn" onclick="resetCamera()">⊙ Reset</button>
</div>
<a href="javascript:history.back()" id="back-btn">
  <button class="btn">← Back to Report</button>
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 40, 100);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 200);
camera.position.set(0, 2, 14);
camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0x1e3a5f, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(6,12,8); sun.castShadow=true; scene.add(sun);
const fill = new THREE.DirectionalLight(0x93c5fd, 0.6); fill.position.set(-8,-6,-4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xf472b6, 0.4); rim.position.set(0,-10,0); scene.add(rim);
const glow = new THREE.PointLight(0x22d3ee, 1.2, 30); glow.position.set(0,6,0); scene.add(glow);

// ── CPK color scheme ──────────────────────────────────────────
const CPK = {
  C:  new THREE.Color(0x404040),
  CA: new THREE.Color(0x808080), // aromatic C — distinct grey
  N:  new THREE.Color(0x3b82f6),
  O:  new THREE.Color(0xef4444),
  S:  new THREE.Color(0xfacc15),
  F:  new THREE.Color(0x4ade80),
  Cl: new THREE.Color(0x16a34a),
  Br: new THREE.Color(0x92400e),
  I:  new THREE.Color(0x7c3aed),
  P:  new THREE.Color(0xf97316),
  H:  new THREE.Color(0xf8fafc),
};

// VdW radii for space-fill
const VDW = {C:1.7,N:1.55,O:1.52,S:1.8,F:1.47,Cl:1.75,Br:1.85,I:1.98,P:1.8,H:1.2};

// ── SMILES 2D → 3D layout ─────────────────────────────────────
// Parse minimal SMILES into atoms+bonds, then do force-directed 3D embedding

const params = new URLSearchParams(location.search);
const smiles  = params.get('smiles') || 'CC(=O)Oc1ccccc1C(=O)O';
const molName = params.get('name')   || 'Molecule';

document.getElementById('mol-title').textContent = molName + ' — 3D Viewer';
document.getElementById('info-name').textContent = molName;

// Simple SMILES parser → atoms/bonds (reuses BioKt's logic ported to JS)
function parseSmiles(s) {
  const atoms = [];
  const bonds = [];
  const stack = [];
  const ringOpen = {};
  let i = 0, atomIdx = 0;
  let pendingBond = null;

  const ATOMIC_NUM = {H:1,C:6,N:7,O:8,F:9,P:15,S:16,Cl:17,Br:35,I:53,B:5,Si:14};
  const VDW_VALS   = {H:1.2,C:1.7,N:1.55,O:1.52,S:1.8,F:1.47,Cl:1.75,Br:1.85,I:1.98,P:1.8,B:1.7,Si:2.1};

  function addAtom(sym, aromatic, charge=0) {
    atoms.push({ idx:atomIdx, sym, aromatic, charge, x:0,y:0,z:0, vdw:VDW_VALS[sym]||1.5 });
    return atomIdx++;
  }
  function addBond(a1,a2,order) { bonds.push({a1,a2,order}); }
  function connectToPrev(newIdx, order) {
    if (stack.length > 0) addBond(stack[stack.length-1], newIdx, order||1.0);
  }

  while (i < s.length) {
    const ch = s[i];
    if (ch === '(') { stack.push(stack[stack.length-1]); pendingBond=null; i++; continue; }
    if (ch === ')') { stack.pop(); pendingBond=null; i++; continue; }
    if (ch === '=') { pendingBond=2; i++; continue; }
    if (ch === '#') { pendingBond=3; i++; continue; }
    if (ch === ':') { pendingBond=1.5; i++; continue; }
    if (ch === '-') { pendingBond=1; i++; continue; }
    if (ch === '.') { stack.length=0; pendingBond=null; i++; continue; }

    if (ch === '[') {
      const end = s.indexOf(']',i);
      const inner = s.substring(i+1,end);
      const symMatch = inner.match(/^(\d*)([A-Z][a-z]?|[a-z])/);
      if (symMatch) {
        const rawSym = symMatch[2];
        const aromatic = rawSym[0] === rawSym[0].toLowerCase() && rawSym[0] !== rawSym[0].toUpperCase();
        const sym = rawSym[0].toUpperCase() + rawSym.slice(1);
        const idx = addAtom(sym, aromatic);
        connectToPrev(idx, pendingBond||(aromatic?1.5:1));
        stack.push(idx); pendingBond=null;
      }
      i = end+1; continue;
    }

    if (ch === '%') {
      const rnum = parseInt(s.substring(i+1,i+3));
      if (ringOpen[rnum] !== undefined) { addBond(ringOpen[rnum],stack[stack.length-1],pendingBond||1); delete ringOpen[rnum]; }
      else ringOpen[rnum] = stack[stack.length-1];
      pendingBond=null; i+=3; continue;
    }

    if (/\d/.test(ch)) {
      const rnum = parseInt(ch);
      const cur = stack[stack.length-1];
      if (ringOpen[rnum] !== undefined) { addBond(ringOpen[rnum],cur,pendingBond||1); delete ringOpen[rnum]; }
      else ringOpen[rnum]=cur;
      pendingBond=null; i++; continue;
    }

    // Atom
    let sym, len, aromatic=false;
    const two = s.substring(i,i+2);
    if (['Cl','Br','Si','Se'].includes(two)) { sym=two; len=2; }
    else if (/[A-Z]/.test(ch)) { sym=ch; len=1; }
    else if (/[a-z]/.test(ch)) { sym=ch.toUpperCase(); len=1; aromatic=true; }
    else { i++; continue; }

    const idx = addAtom(sym, aromatic);
    const bo = pendingBond || (aromatic && stack.length > 0 && atoms[stack[stack.length-1]]?.aromatic ? 1.5 : 1);
    connectToPrev(idx, bo);
    stack.push(idx); pendingBond=null; i+=len;
  }
  return { atoms, bonds };
}

const mol = parseSmiles(smiles);

// Update info
document.getElementById('info-formula').textContent = (() => {
  const cnt = {};
  mol.atoms.forEach(a => cnt[a.sym]=(cnt[a.sym]||0)+1);
  let f='';
  if(cnt.C){f+='C'+(cnt.C>1?cnt.C:'')}
  if(cnt.H){f+='H'+(cnt.H>1?cnt.H:'')}
  Object.keys(cnt).filter(k=>k!='C'&&k!='H').sort().forEach(k=>f+=k+(cnt[k]>1?cnt[k]:''));
  return f||'—';
})();
document.getElementById('info-atoms').textContent = mol.atoms.length;
document.getElementById('info-bonds').textContent = mol.bonds.length;

// Count rings (simple: cycles in graph)
const adjList = {};
mol.atoms.forEach(a=>adjList[a.idx]=[]);
mol.bonds.forEach(b=>{adjList[b.a1].push(b.a2);adjList[b.a2].push(b.a1);});
const rings = mol.bonds.length - mol.atoms.length + 1; // Euler: rings = E - V + C
document.getElementById('info-rings').textContent = Math.max(0, rings);

// ── Force-directed 3D embedding ───────────────────────────────
const N = mol.atoms.length;

// Initial random positions
mol.atoms.forEach((a,i) => {
  a.x = (Math.random()-0.5)*4;
  a.y = (Math.random()-0.5)*4;
  a.z = (Math.random()-0.5)*2;
});

// Spring-charge layout
const BOND_LEN = 1.5;
const K_SPRING = 0.3;
const K_REPEL  = 8.0;
const DAMP     = 0.85;
const vx=new Float64Array(N),vy=new Float64Array(N),vz=new Float64Array(N);

for (let iter=0; iter<300; iter++) {
  const fx=new Float64Array(N),fy=new Float64Array(N),fz=new Float64Array(N);

  // Repulsion between all pairs
  for (let a=0;a<N;a++) for (let b=a+1;b<N;b++) {
    const dx=mol.atoms[a].x-mol.atoms[b].x;
    const dy=mol.atoms[a].y-mol.atoms[b].y;
    const dz=mol.atoms[a].z-mol.atoms[b].z;
    const d2=dx*dx+dy*dy+dz*dz+0.01;
    const f=K_REPEL/(d2*Math.sqrt(d2));
    fx[a]+=f*dx;fy[a]+=f*dy;fz[a]+=f*dz;
    fx[b]-=f*dx;fy[b]-=f*dy;fz[b]-=f*dz;
  }

  // Spring attraction along bonds
  mol.bonds.forEach(b=>{
    const a1=b.a1,a2=b.a2;
    const dx=mol.atoms[a2].x-mol.atoms[a1].x;
    const dy=mol.atoms[a2].y-mol.atoms[a1].y;
    const dz=mol.atoms[a2].z-mol.atoms[a1].z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.001;
    const f=K_SPRING*(d-BOND_LEN)/d;
    fx[a1]+=f*dx;fy[a1]+=f*dy;fz[a1]+=f*dz;
    fx[a2]-=f*dx;fy[a2]-=f*dy;fz[a2]-=f*dz;
  });

  for (let i=0;i<N;i++) {
    vx[i]=(vx[i]+fx[i])*DAMP;
    vy[i]=(vy[i]+fy[i])*DAMP;
    vz[i]=(vz[i]+fz[i])*DAMP;
    mol.atoms[i].x+=vx[i]*0.05;
    mol.atoms[i].y+=vy[i]*0.05;
    mol.atoms[i].z+=vz[i]*0.05;
  }
}

// Center
const cx=mol.atoms.reduce((s,a)=>s+a.x,0)/N;
const cy=mol.atoms.reduce((s,a)=>s+a.y,0)/N;
const cz=mol.atoms.reduce((s,a)=>s+a.z,0)/N;
mol.atoms.forEach(a=>{a.x-=cx;a.y-=cy;a.z-=cz;});

// Scale to nice size
const maxR=mol.atoms.reduce((s,a)=>Math.max(s,Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)),0);
const scale = maxR > 0.1 ? 5.0/maxR : 1.0;
mol.atoms.forEach(a=>{a.x*=scale;a.y*=scale;a.z*=scale;});

// ── Build 3D mesh ─────────────────────────────────────────────
const molGroup = new THREE.Group();
scene.add(molGroup);

const atomMeshes=[], bondMeshes=[];
const SCALE=1.0;

mol.atoms.forEach(a => {
  const col = a.aromatic ? new THREE.Color(0x4ade80) : (CPK[a.sym] || new THREE.Color(0x808080));
  const r = (VDW[a.sym]||1.5)*0.38*SCALE;
  const geo = new THREE.SphereGeometry(r, 20, 20);
  const mat = new THREE.MeshPhongMaterial({
    color:col, shininess:120, specular:new THREE.Color(0xffffff),
    emissive:col.clone().multiplyScalar(0.1)
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(a.x, a.y, a.z);
  m.userData = { type:'atom', sym:a.sym, idx:a.idx, style:'ballstick', origR:r };
  m.castShadow = true;
  molGroup.add(m);
  atomMeshes.push(m);
});

mol.bonds.forEach(b => {
  const a1=mol.atoms[b.a1], a2=mol.atoms[b.a2];
  const from = new THREE.Vector3(a1.x,a1.y,a1.z);
  const to   = new THREE.Vector3(a2.x,a2.y,a2.z);
  const dir  = new THREE.Vector3().subVectors(to,from);
  const len  = dir.length();
  const mid  = new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);

  const nBonds = b.order===2 ? 2 : b.order===3 ? 3 : 1;
  for (let k=0;k<nBonds;k++) {
    const offset = nBonds===1 ? 0 : (k-0.5)*0.22;
    const perp = new THREE.Vector3().crossVectors(dir.normalize(), new THREE.Vector3(0,1,0.001)).normalize();
    const geo  = new THREE.CylinderGeometry(0.1*SCALE, 0.1*SCALE, len, 8);
    const mat  = new THREE.MeshPhongMaterial({ color:0x94a3b8, shininess:40 });
    const cyl  = new THREE.Mesh(geo, mat);
    cyl.position.copy(mid).addScaledVector(perp, offset);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    cyl.userData = { type:'bond', order:b.order, style:'ballstick' };
    cyl.castShadow = true;
    molGroup.add(cyl);
    bondMeshes.push(cyl);
  }
});

// Stars
const sg=new THREE.BufferGeometry();
const sv=[];
for(let i=0;i<1200;i++)sv.push((Math.random()-.5)*150,(Math.random()-.5)*150,(Math.random()-.5)*150);
sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x4b5563,size:0.15})));

// Grid
const grid=new THREE.GridHelper(30,15,0x1e3a5f,0x1e3a5f);
grid.position.y=-7;
scene.add(grid);

// ── Controls ──────────────────────────────────────────────────
let isDragging=false,lastX=0,lastY=0,rotY=0,rotX=0.1,targetRotY=0,targetRotX=0.1,zoom=14,targetZoom=14;
let spinning=true, currentStyle='ballstick';

document.getElementById('canvas').addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY});
document.addEventListener('mouseup',()=>isDragging=false);
document.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  targetRotY+=(e.clientX-lastX)*0.006;
  targetRotX+=(e.clientY-lastY)*0.006;
  targetRotX=Math.max(-1.4,Math.min(1.4,targetRotX));
  lastX=e.clientX;lastY=e.clientY;
});
document.getElementById('canvas').addEventListener('wheel',e=>{targetZoom=Math.max(3,Math.min(40,targetZoom+e.deltaY*0.02))});
document.getElementById('canvas').addEventListener('touchstart',e=>{isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY});
document.addEventListener('touchend',()=>isDragging=false);
document.addEventListener('touchmove',e=>{
  if(!isDragging)return;
  targetRotY+=(e.touches[0].clientX-lastX)*0.006;
  targetRotX+=(e.touches[0].clientY-lastY)*0.006;
  lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
});

function setStyle(v) {
  currentStyle=v;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');

  atomMeshes.forEach(m => {
    if(v==='spacefill') {
      m.visible=true;
      m.scale.setScalar(1.8);
    } else if(v==='wireframe'||v==='stick') {
      m.visible = v==='stick';
      m.scale.setScalar(0.6);
    } else {
      m.visible=true; m.scale.setScalar(1.0);
    }
  });

  bondMeshes.forEach(b => {
    b.visible = v!=='spacefill';
    b.material.wireframe = (v==='wireframe');
    b.scale.setScalar(v==='stick' ? 1.8 : 1.0);
  });
}

function toggleSpin(){
  spinning=!spinning;
  event.target.textContent=spinning?'⟳ Auto Spin':'⏸ Paused';
  event.target.classList.toggle('active',spinning);
}
function resetCamera(){targetRotY=0;targetRotX=0.1;targetZoom=14;}

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.005;
  rotY+=(targetRotY-rotY)*0.08;
  rotX+=(targetRotX-rotX)*0.08;
  zoom+=(targetZoom-zoom)*0.08;
  if(spinning) targetRotY+=0.004;

  glow.position.set(Math.cos(t)*8, 6+Math.sin(t*0.6)*3, Math.sin(t)*8);
  glow.intensity = 0.8+0.4*Math.sin(t*1.5);

  camera.position.set(
    zoom*Math.cos(rotX)*Math.sin(rotY),
    zoom*Math.sin(rotX),
    zoom*Math.cos(rotX)*Math.cos(rotY)
  );
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
